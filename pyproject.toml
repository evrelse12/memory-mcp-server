[project]
name = "memory-mcp"
version = "0.6.0"
description = "Long-term memory MCP server: knowledge graph, hybrid search, Ebbinghaus decay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.1.4,<5",
    "aiosqlite>=0.21,<0.23",
    "sqlite-vec>=0.1.6,<0.2",
    "httpx>=0.27,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.4,<3",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "core", "services", "agents", "tools", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
