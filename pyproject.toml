[project]
name = "memory-mcp"
version = "0.4.0"
description = "Long-term memory MCP server: knowledge graph, hybrid search, Ebbinghaus decay"
readme = "README.md"
readme_ru = "README_ru.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # single source of truth: requirements.txt

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "core", "services", "agents", "tools", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
